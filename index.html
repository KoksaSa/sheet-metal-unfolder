<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sheet Metal Unfolder v3.8</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config={darkMode:'class'}</script>
  <link rel="stylesheet" href="css/styles.css">
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
</head>
<body class="bg-white text-gray-900 dark:bg-gray-900 dark:text-gray-100 h-screen overflow-hidden">

<div id="app" class="h-screen flex flex-col">
  <!-- HEADER -->
  <header class="no-print relative border-b bg-white dark:bg-gray-800 px-3 sm:px-4 py-2 flex items-center justify-between shrink-0 shadow-sm" style="border-bottom:2px solid transparent;background-image:linear-gradient(transparent 95%,rgba(34,197,94,.2))">
    <div class="flex items-center gap-2.5">
      <div class="w-9 h-9 rounded-xl bg-gradient-to-br from-green-500 to-green-700 flex items-center justify-center shadow-lg" style="box-shadow:0 4px 12px rgba(34,197,94,.3)">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8H16V21H20V4H3Z" fill="rgba(255,255,255,.15)"/><path d="M3 8H16V21H20V4H3Z"/><line x1="3" y1="4" x2="20" y2="4" stroke-dasharray="1 1" opacity=".4"/><circle cx="16" cy="8" r="1.5" fill="rgba(255,255,255,.3)"/></svg>
      </div>
      <div class="hidden sm:block">
        <h1 id="h-title" class="text-sm font-bold leading-tight tracking-tight"></h1>
        <p class="text-[10px] text-gray-500 dark:text-gray-400 leading-tight font-medium">Sheet Metal Unfolder v3.8</p>
      </div>
    </div>
    <div class="flex items-center gap-1.5 sm:gap-2 flex-wrap justify-end">
      <!-- btn-unfold removed: auto-unfold is enabled by default -->
      <button onclick="generateDrawing()" id="btn-drawing" class="text-xs h-8 border border-green-200 dark:border-green-800 text-green-700 dark:text-green-400 hover:bg-green-50 dark:hover:bg-green-950/30 px-2.5 rounded-md flex items-center gap-1 disabled:opacity-40 disabled:cursor-not-allowed" disabled>
        <i data-lucide="file-text" class="h-3.5 w-3.5"></i><span class="hidden md:inline" data-i18n="drawingBtn"></span>
      </button>
      <button onclick="exportDXF()" id="btn-dxf" class="text-xs h-8 border border-green-200 dark:border-green-800 text-green-700 dark:text-green-400 hover:bg-green-50 dark:hover:bg-green-950/30 px-2.5 rounded-md flex items-center gap-1 disabled:opacity-40 disabled:cursor-not-allowed" disabled>
        <i data-lucide="file-down" class="h-3.5 w-3.5"></i><span class="hidden md:inline" data-i18n="downloadDxf"></span>
      </button>
      <button onclick="exportSVG()" id="btn-svg" class="text-xs h-8 border border-green-200 dark:border-green-800 text-green-700 dark:text-green-400 hover:bg-green-50 dark:hover:bg-green-950/30 px-2.5 rounded-md flex items-center gap-1 disabled:opacity-40 disabled:cursor-not-allowed" disabled>
        <i data-lucide="file-code-2" class="h-3.5 w-3.5"></i><span class="hidden md:inline" data-i18n="downloadSvg"></span>
      </button>
      <button onclick="exportPNG(true)" id="btn-pngw" class="text-xs h-8 border border-green-200 dark:border-green-800 text-green-700 dark:text-green-400 hover:bg-green-50 dark:hover:bg-green-950/30 px-2.5 rounded-md flex items-center gap-1 disabled:opacity-40 disabled:cursor-not-allowed" disabled>
        <i data-lucide="printer" class="h-3.5 w-3.5"></i><span class="hidden xl:inline" data-i18n="whitePng"></span>
      </button>
      <button onclick="exportPNG(false)" id="btn-png" class="text-xs h-8 border border-green-200 dark:border-green-800 text-green-700 dark:text-green-400 hover:bg-green-50 dark:hover:bg-green-950/30 px-2.5 rounded-md flex items-center gap-1 disabled:opacity-40 disabled:cursor-not-allowed" disabled>
        <i data-lucide="image" class="h-3.5 w-3.5"></i><span class="hidden md:inline" data-i18n="downloadPng"></span>
      </button>
      <div class="hidden sm:flex items-center gap-1">
        <button onclick="exportJSON()" title="" class="h-8 w-8 flex items-center justify-center rounded-md hover:bg-green-50 dark:hover:bg-green-950/30 text-gray-600 dark:text-gray-400"><i data-lucide="file-up" class="h-3.5 w-3.5"></i></button>
        <button onclick="triggerImport()" title="" class="h-8 w-8 flex items-center justify-center rounded-md hover:bg-green-50 dark:hover:bg-green-950/30 text-gray-600 dark:text-gray-400"><i data-lucide="file-down" class="h-3.5 w-3.5"></i></button>
      </div>
      <input type="file" id="file-import" accept=".json" class="hidden" onchange="importJSON(event)">
      <div class="w-px h-5 bg-gray-200 dark:bg-gray-700 hidden sm:block"></div>
      <button onclick="toggleAutoUnfold()" id="btn-auto" class="h-8 w-8 flex items-center justify-center rounded-md text-gray-600 dark:text-gray-400"><i data-lucide="zap" class="h-3.5 w-3.5"></i></button>
      <button onclick="showShortcuts()" class="h-8 w-8 flex items-center justify-center rounded-md text-gray-600 dark:text-gray-400"><i data-lucide="keyboard" class="h-3.5 w-3.5"></i></button>
      <button onclick="toggleTheme()" class="h-8 w-8 flex items-center justify-center rounded-md text-gray-600 dark:text-gray-400 relative" id="btn-theme"><i data-lucide="sun" class="h-3.5 w-3.5" id="icon-sun"></i><i data-lucide="moon" class="h-3.5 w-3.5 hidden" id="icon-moon"></i></button>
      <button onclick="toggleLang()" class="h-8 w-8 flex items-center justify-center rounded-md text-gray-600 dark:text-gray-400 relative"><i data-lucide="globe" class="h-3.5 w-3.5"></i><span class="absolute -bottom-0.5 -right-0.5 text-[7px] font-bold" id="lang-label"></span></button>
      <button onclick="window.print()" id="btn-pdf" class="text-xs h-8 border border-green-200 dark:border-green-800 text-green-700 dark:text-green-400 hover:bg-green-50 dark:hover:bg-green-950/30 px-2.5 rounded-md flex items-center gap-1 disabled:opacity-40" disabled>
        <i data-lucide="printer" class="h-3.5 w-3.5"></i><span class="hidden md:inline" data-i18n="pdf"></span>
      </button>
      <button onclick="toggleLeftSidebar()" class="lg:hidden h-8 w-8 flex items-center justify-center rounded-md border border-green-200 dark:border-green-800 text-green-700 dark:text-green-400"><i data-lucide="settings" class="h-4 w-4"></i></button>
    </div>
  </header>

  <!-- MOBILE SIDEBAR DRAWER -->
  <div id="mobile-sidebar" class="fixed inset-0 z-50 hidden">
    <div class="absolute inset-0 bg-black/40" onclick="toggleLeftSidebar()"></div>
    <div class="absolute left-0 top-0 bottom-0 w-80 bg-white dark:bg-gray-800 shadow-xl overflow-y-auto p-3 space-y-4">
      <div class="flex items-center justify-between mb-2">
        <h3 class="text-xs font-semibold text-gray-500 dark:text-gray-400 uppercase tracking-wider border-l-2 border-green-500 pl-2" data-i18n="paramsSection"></h3>
        <button onclick="toggleLeftSidebar()" class="h-6 w-6 flex items-center justify-center rounded hover:bg-gray-100 dark:hover:bg-gray-700"><i data-lucide="x" class="h-4 w-4"></i></button>
      </div>
      <div id="mobile-params"></div>
    </div>
  </div>

  <!-- MAIN -->
  <main class="flex-1 flex h-full overflow-hidden">
    <!-- LEFT SIDEBAR -->
    <aside id="left-sidebar" class="no-print hidden lg:flex w-64 xl:w-72 shrink-0 border-r bg-white dark:bg-gray-800 flex-col overflow-y-auto">
      <div class="p-3 space-y-4 flex-1">
        <div>
          <h3 class="text-xs font-semibold text-gray-500 dark:text-gray-400 uppercase tracking-wider mb-2 flex items-center gap-1.5 border-l-2 border-green-500 pl-2">
            <i data-lucide="settings" class="h-3 w-3"></i><span data-i18n="paramsSection"></span>
          </h3>
          <!-- TOOLS -->
          <div class="space-y-2">
            <label class="text-xs font-semibold text-gray-500 dark:text-gray-400 uppercase tracking-wider" data-i18n="tools"></label>
            <div class="flex gap-1" id="tool-buttons"></div>
          </div>
          <!-- ACTIONS -->
          <div class="flex gap-1 mt-2">
            <button onclick="doUndo()" id="btn-undo" class="flex-1 gap-1.5 h-8 text-xs border border-gray-200 dark:border-gray-700 rounded-md flex items-center justify-center hover:bg-amber-50 dark:hover:bg-amber-950/30 hover:text-amber-700 disabled:opacity-40 disabled:cursor-not-allowed"><i data-lucide="undo-2" class="h-3.5 w-3.5"></i><span class="hidden sm:inline" data-i18n="undo"></span></button>
            <button onclick="doRedo()" id="btn-redo" class="flex-1 gap-1.5 h-8 text-xs border border-gray-200 dark:border-gray-700 rounded-md flex items-center justify-center hover:bg-amber-50 dark:hover:bg-amber-950/30 hover:text-amber-700 disabled:opacity-40 disabled:cursor-not-allowed"><i data-lucide="redo-2" class="h-3.5 w-3.5"></i><span class="hidden sm:inline" data-i18n="redo"></span></button>
            <button onclick="clearDrawing()" id="btn-clear" class="flex-1 gap-1.5 h-8 text-xs border border-gray-200 dark:border-gray-700 rounded-md flex items-center justify-center hover:bg-red-50 hover:text-red-600 disabled:opacity-40 disabled:cursor-not-allowed"><i data-lucide="trash-2" class="h-3.5 w-3.5"></i><span class="hidden sm:inline" data-i18n="clear"></span></button>
          </div>
          <hr class="my-3 border-gray-200 dark:border-gray-700">
          <!-- METAL PARAMS -->
          <div class="space-y-2" id="metal-params-container"></div>
          <hr class="my-3 border-gray-200 dark:border-gray-700">
          <!-- GRID/SNAP -->
          <div class="space-y-2" id="snap-container"></div>
          <!-- PROFILE STATS -->
          <div id="stats-container"></div>
          <!-- POINTS TABLE -->
          <div id="points-table-container"></div>
          <!-- IMPORT -->
          <button onclick="triggerImport()" class="w-full text-xs h-8 gap-1.5 border border-gray-200 dark:border-gray-700 rounded-md flex items-center justify-center hover:bg-green-50 hover:text-green-700 dark:hover:bg-green-950/30 mt-2"><i data-lucide="file-up" class="h-3.5 w-3.5"></i><span data-i18n="importProfile"></span></button>
        </div>
        <hr class="border-gray-200 dark:border-gray-700">
        <!-- PRESETS -->
        <div id="presets-container"></div>
      </div>
    </aside>

    <!-- CENTER CANVAS -->
    <div class="no-print flex-1 flex flex-col min-w-0">
      <div class="flex-1 p-1.5 sm:p-2 min-h-0 relative" id="canvas-container">
        <canvas id="draw-canvas" class="absolute inset-0 w-full h-full rounded-lg" style="cursor:crosshair"></canvas>
        <!-- STATUS BAR -->
        <div id="status-bar" class="absolute bottom-2 left-2 text-[10px] font-mono text-gray-500 dark:text-gray-400 bg-white/80 dark:bg-gray-800/80 px-2 py-0.5 rounded backdrop-blur-sm"></div>
      </div>
      <!-- MOBILE UNFOLD -->
      <div id="mobile-unfold" class="md:hidden border-t bg-white dark:bg-gray-800 p-3 space-y-2"></div>
    </div>

    <!-- RIGHT SIDEBAR -->
    <aside class="hidden md:flex w-64 lg:w-72 xl:w-80 shrink-0 border-l bg-white dark:bg-gray-800 flex-col overflow-y-auto">
      <div class="p-3 pb-2 shrink-0">
        <div class="flex items-center justify-between">
          <div>
            <h2 class="text-sm font-semibold flex items-center gap-1.5"><i data-lucide="box" class="h-4 w-4 text-green-600 dark:text-green-400"></i><span data-i18n="unfoldTitle"></span></h2>
            <p class="text-[10px] text-gray-500 dark:text-gray-400 mt-0.5" data-i18n="flatBlankSubtitle"></p>
          </div>
          <span id="bend-badge" class="text-[10px] h-5 font-normal bg-gray-100 dark:bg-gray-700 text-gray-600 dark:text-gray-300 px-2 py-0.5 rounded-full hidden"></span>
        </div>
      </div>
      <div class="shrink-0 px-3 relative" style="height:180px">
        <div class="w-full h-full rounded-xl overflow-hidden border-2 border-green-400 dark:border-green-600 relative" style="animation:gradientPulse 3s ease-in-out infinite;background:linear-gradient(135deg,#4ade80,#34d399,#22c55e);padding:2px">
          <div class="w-full h-full rounded-[10px] overflow-hidden bg-white dark:bg-gray-900 relative" id="unfold-container" style="overscroll-behavior:contain;touch-action:none">
            <canvas id="unfold-canvas" class="absolute inset-0 w-full h-full"></canvas>
            <button id="btn-play-pause" onclick="toggleBendAnim()" class="absolute top-2 left-2 z-10 w-6 h-6 flex items-center justify-center rounded-full bg-white/80 dark:bg-gray-800/80 backdrop-blur-sm border border-gray-200 dark:border-gray-700 text-gray-500 hover:text-gray-900 dark:hover:text-gray-100 transition-colors hidden"><i data-lucide="play" class="h-3 w-3 ml-0.5" id="icon-play"></i></button>
          </div>
        </div>
      </div>
      <!-- 3D PREVIEW -->
      <div class="px-3 pb-2 shrink-0">
        <h3 class="text-[10px] font-semibold text-gray-500 dark:text-gray-400 uppercase tracking-wider mb-1.5 flex items-center gap-1"><i data-lucide="box" class="h-3 w-3"></i><span data-i18n="view3d"></span></h3>
        <div class="w-full h-48 rounded-lg overflow-hidden border-2 border-green-400 dark:border-green-600 bg-gray-50 dark:bg-gray-800/50 relative cursor-pointer hover:border-green-500 dark:hover:border-green-500 transition-colors" id="view3d-container" onclick="toggle3DModal()">
          <canvas id="view3d-canvas" class="absolute inset-0 w-full h-full block"></canvas>
          <div class="absolute bottom-1.5 left-1.5 text-[8px] text-gray-400 font-mono" id="view3d-controls"></div>
          <div class="absolute top-1.5 right-1.5 text-[8px] text-gray-400 bg-black/30 px-1 rounded">⤢</div>
        </div>
      </div>
      <div id="unfold-info" class="flex-1 min-h-0 overflow-y-auto px-3 pb-2"></div>
    </aside>
  </main>

  <!-- 3D MODAL -->
  <div id="view3d-modal" class="fixed inset-0 z-[300] hidden">
    <div class="absolute inset-0 bg-black/60 backdrop-blur-sm" onclick="close3DModal()"></div>
    <div class="absolute inset-4 bg-white dark:bg-gray-900 rounded-xl border border-gray-300 dark:border-gray-600 shadow-2xl flex flex-col overflow-hidden">
      <div class="flex items-center justify-between px-4 py-2 border-b border-gray-200 dark:border-gray-700 bg-gray-50 dark:bg-gray-800">
        <h3 class="text-sm font-semibold flex items-center gap-2"><i data-lucide="box" class="h-4 w-4 text-green-600 dark:text-green-400"></i><span data-i18n="view3d"></span> — <span data-i18n="expanded3d"></span></h3>
        <button onclick="close3DModal()" class="h-7 w-7 flex items-center justify-center rounded hover:bg-gray-200 dark:hover:bg-gray-700 text-gray-500"><i data-lucide="x" class="h-4 w-4"></i></button>
      </div>
      <div class="flex-1 relative" id="view3d-modal-container">
        <canvas id="view3d-canvas-full" class="absolute inset-0 w-full h-full block"></canvas>
        <div class="absolute bottom-2 left-2 text-[10px] text-gray-500 dark:text-gray-400 font-mono bg-white/80 dark:bg-gray-900/80 px-1.5 rounded" id="view3d-controls-full"></div>
      </div>
    </div>
  </div>

  <!-- FOOTER -->
  <footer class="no-print border-t bg-white dark:bg-gray-800 px-4 py-1.5 flex items-center justify-between shrink-0">
    <p class="text-[10px] text-gray-500 dark:text-gray-400 hidden sm:block" id="footer-controls"></p>
    <p class="text-[10px] text-gray-500 dark:text-gray-400 sm:hidden">v3.8</p>
    <p class="text-[10px] text-gray-500 dark:text-gray-400 font-medium">Sheet Metal Unfolder v3.8</p>
  </footer>
</div>

<!-- TOAST -->
<div id="toast-container"></div>
<!-- CONTEXT MENU -->
<div id="context-menu" class="context-menu hidden"></div>
<!-- DIALOGS -->
<div id="dialog-overlay" class="dialog-overlay hidden" onclick="if(event.target===this)closeDialog()"><div class="dialog-box" id="dialog-content"></div></div>

<!-- ==================== SCRIPTS (order matters) ==================== -->
<script src="js/i18n.js"></script>
<script src="js/data.js"></script>
<script src="js/engine.js"></script>
<script src="js/state.js"></script>
<script src="js/canvas.js"></script>
<script src="js/ui.js"></script>
<script src="js/app.js"></script>
</body>
</html>
